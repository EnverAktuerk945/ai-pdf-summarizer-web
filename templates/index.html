<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI PDF Summarizer</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📄 AI PDF Summarizer</h1>
            <p>Lade ein PDF-Dokument hoch, um eine präzise KI-Zusammenfassung zu generieren.</p>
        </header>

        <main>
            <section class="upload-section">
                <form id="uploadForm" novalidate>
                    <div class="drop-zone" id="dropZone">
                        <span class="drop-zone-icon">📁</span>
                        <p class="drop-zone-text">PDF hierher ziehen oder <strong>durchsuchen</strong></p>
                        <input type="file" id="fileInput" name="file" accept=".pdf" hidden>
                    </div>
                    <div id="fileInfo" class="file-info hidden">
                        <span id="fileName"></span>
                        <button type="button" id="removeFileBtn" class="btn-remove">✕</button>
                    </div>
                    <button type="submit" id="submitBtn" class="btn-submit" disabled>Zusammenfassen</button>
                </form>
            </section>

            <section id="statusSection" class="status-section hidden">
                <div class="spinner"></div>
                <p id="statusText">Analysiere Dokument und erstelle Zusammenfassung...</p>
            </section>

            <section id="errorSection" class="error-section hidden">
                <p id="errorMessage"></p>
            </section>

            <section id="resultSection" class="result-section hidden">
                <div class="result-header">
                    <h2>Zusammenfassung</h2>
                    <button id="copyBtn" class="btn-secondary">Kopieren</button>
                </div>
                <div id="resultContent" class="result-content"></div>
            </section>
        </main>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
